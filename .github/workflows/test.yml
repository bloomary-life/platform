name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test tests/*.cjs
      - name: Trace check
        if: hashFiles('REQUIREMENTS.md') != ''
        run: bash scripts/trace-check.sh REQUIREMENTS.md tests
